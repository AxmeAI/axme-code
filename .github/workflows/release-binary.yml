name: release-binary

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            node-arch: x64
          - os: ubuntu-latest
            target: linux-arm64
            node-arch: arm64
          - os: macos-latest
            target: darwin-arm64
            node-arch: arm64
          - os: macos-latest
            target: darwin-x64
            node-arch: x64
          # Windows bundles are built on ubuntu-latest because esbuild output
          # is platform-agnostic JS — the bundle runs under Node on any OS.
          # install.ps1 generates the accompanying axme-code.cmd wrapper at
          # install time so we ship a single file per Windows arch.
          - os: ubuntu-latest
            target: windows-x64
            node-arch: x64
          - os: ubuntu-latest
            target: windows-arm64
            node-arch: arm64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Guard against tag/manifest drift. June 2026 postmortem: the v0.6.0
      # tag was pushed before the release PR merged (binaries said 0.6.0,
      # package.json said 0.5.0), and .claude-plugin/plugin.json was not
      # bumped at all for two releases — Claude Code keys plugin update
      # detection on that version, so plugin users were stuck. Fail the
      # whole release BEFORE building anything if the three disagree.
      - name: Verify tag matches version manifests
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="$(jq -r .version package.json)"
          plugin="$(jq -r .version .claude-plugin/plugin.json)"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$plugin" ]; then
            echo "::error::Version drift: tag v${tag} vs package.json ${pkg} vs .claude-plugin/plugin.json ${plugin}. Merge the release PR (which bumps all manifests in lockstep) BEFORE pushing the tag, then re-tag on the merged commit."
            exit 1
          fi
          echo "Version manifests consistent: v${tag}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create standalone bundle
        run: |
          mkdir -p release
          # Bundle everything into a single file with node shebang.
          # @cursor/sdk is marked external because its TypeScript declarations
          # re-export internal workspace paths (`@anysphere/cursor-sdk-local-runtime/*`,
          # `./messages.js`, `./platform.js`, etc.) that esbuild cannot resolve
          # in this second-pass bundle step. The SDK is in optionalDependencies
          # and the AgentSdk factory falls back to the Claude wrapper via a
          # MODULE_NOT_FOUND-tolerant dynamic import — standalone-binary users
          # are not on Cursor (Cursor users get the .vsix), so the runtime
          # fallback is correct. build.mjs's plugin variant already marks the
          # same package external for the same reason (see build.mjs:74).
          npx esbuild dist/cli.mjs --bundle --platform=node --target=node20 \
            --outfile=release/axme-code-${{ matrix.target }} \
            --banner:js='#!/usr/bin/env node' \
            --external:@cursor/sdk
          chmod +x release/axme-code-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: axme-code-${{ matrix.target }}
          path: release/axme-code-${{ matrix.target }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/axme-code-*
          generate_release_notes: true

  publish-npm:
    # Publish @axme/code to npm. We do this in the same workflow as release-binary
    # (chained via `needs: release`) instead of a separate `release: published`
    # trigger workflow because GitHub Actions does NOT fire workflow events from
    # actions taken by GITHUB_TOKEN (anti-recursion safety). When release-binary
    # creates the GitHub release via softprops/action-gh-release, no downstream
    # workflow listening on `release: published` will run. Chaining via `needs:`
    # in the same workflow run avoids that limitation entirely.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  sync-plugin-repo:
    # Sync plugin bundle to AxmeAI/axme-code-plugin. Same anti-recursion reason:
    # if we wait for `release: published` we never run, so we chain on `needs: publish-npm`
    # to keep the previous behavior (sync after npm publish succeeds).
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Sync plugin repo
        env:
          PLUGIN_REPO_TOKEN: ${{ secrets.PLUGIN_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${PLUGIN_REPO_TOKEN}@github.com/AxmeAI/axme-code-plugin.git /tmp/plugin-repo
          cd /tmp/plugin-repo
          # Remove old files (except .git and .gitignore)
          ls -A | grep -v '^\.\(git\|gitignore\)$' | xargs rm -rf
          # Copy new plugin bundle
          cp -r ${GITHUB_WORKSPACE}/dist/plugin/. .
          cp ${GITHUB_WORKSPACE}/dist/plugin/.mcp.json .
          cp -r ${GITHUB_WORKSPACE}/dist/plugin/.claude-plugin .
          # Remove sourcemaps and node_modules (not needed in repo)
          rm -f *.map
          rm -rf node_modules package-lock.json
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "sync: ${GITHUB_REF_NAME} from axme-code" || echo "No changes to commit"
          git push

  open-marketplace-pr:
    # Final mile of the Claude Code plugin channel. `claude plugin install
    # axme-code@claude-community` installs the commit SHA pinned in
    # anthropics/claude-plugins-community — NOT our plugin repo HEAD. Through
    # April–June 2026 that pin silently stayed at v0.2.9 because bumping it
    # was a manual PR that no process owned. This job opens (or updates) the
    # bump PR automatically after every successful sync. Anthropic
    # maintainers still review and merge it — that part is their
    # supply-chain gate and cannot (and should not) be automated away.
    #
    # Idempotency: a single standing branch `bump-axme-code` on the AxmeAI
    # fork is force-pushed each release. If a bump PR is already open, the
    # push updates it in place; otherwise a new PR is created. Consecutive
    # releases before a merge therefore never stack duplicate PRs.
    #
    # Token: needs push access to the AxmeAI/claude-plugins-community fork
    # AND permission to open PRs on the public upstream — a classic PAT
    # with `public_repo`/`repo` scope (fine-grained PATs cannot create PRs
    # on repos outside their owner). Falls back to PLUGIN_REPO_TOKEN; if
    # that one is fine-grained to axme-code-plugin only, add a
    # MARKETPLACE_PR_TOKEN secret.
    needs: sync-plugin-repo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Open or update marketplace bump PR
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_PR_TOKEN || secrets.PLUGIN_REPO_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          new_sha="$(gh api repos/AxmeAI/axme-code-plugin/commits/main --jq .sha)"

          old_sha="$(curl -fsSL https://raw.githubusercontent.com/anthropics/claude-plugins-community/main/.claude-plugin/marketplace.json \
            | jq -r '.plugins[] | select(.name == "axme-code") | .source.sha')"
          if [ -z "$old_sha" ] || [ "$old_sha" = "null" ]; then
            echo "::error::Could not read the current axme-code pin from upstream marketplace.json"
            exit 1
          fi
          if [ "$old_sha" = "$new_sha" ]; then
            echo "Marketplace pin already current ($new_sha) — nothing to do."
            exit 0
          fi

          # Branch off upstream main so the PR diff is exactly one line,
          # regardless of how stale our fork's main is.
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/AxmeAI/claude-plugins-community.git" fork
          cd fork
          git fetch --depth 1 https://github.com/anthropics/claude-plugins-community.git main
          git checkout -B bump-axme-code FETCH_HEAD

          python3 - "$old_sha" "$new_sha" <<'PY'
          import json, sys
          old, new = sys.argv[1], sys.argv[2]
          path = ".claude-plugin/marketplace.json"
          raw = open(path).read()
          count = raw.count(old)
          assert count == 1, f"expected pinned SHA exactly once in marketplace.json, found {count}"
          updated = raw.replace(old, new)
          entry = [p for p in json.loads(updated)["plugins"] if p["name"] == "axme-code"][0]
          assert entry["source"]["sha"] == new, "axme-code entry not updated correctly"
          open(path, "w").write(updated)
          print(f"pin {old[:7]} -> {new[:7]} OK")
          PY

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .claude-plugin/marketplace.json
          git commit -m "Update axme-code to v${version}"
          git push -f origin bump-axme-code

          open_prs="$(gh pr list --repo anthropics/claude-plugins-community \
            --head AxmeAI:bump-axme-code --state open --json number --jq 'length')"
          if [ "$open_prs" -gt 0 ]; then
            echo "Existing bump PR updated in place via force-push."
          else
            gh pr create --repo anthropics/claude-plugins-community \
              --base main --head AxmeAI:bump-axme-code \
              --title "Update axme-code to v${version}" \
              --body "$(printf 'Bumps the pinned SHA for **axme-code** to the v%s sync commit ([`%s`](https://github.com/AxmeAI/axme-code-plugin/commit/%s)) of AxmeAI/axme-code-plugin.\n\nOne-line diff — only the existing entry'"'"'s `source.sha` changes. Opened automatically by the axme-code release workflow; maintained by the AxmeAI org (plugin author).' "$version" "${new_sha:0:7}" "$new_sha")"
          fi
